services:
  api:
    build: .
    image: steiner-audit:latest
    command: ["python", "-m", "app.server"]
    environment:
      PORT: "8080"
    ports:
      # Host-side port is configurable: API_HOST_PORT=9090 docker compose up api
      - "${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: "no"

  verify:
    image: steiner-audit:latest
    build: .
    command: ["python", "-m", "verify.verify"]
    environment:
      API_URL: "http://api:8080"
      APP_ROOT: "/app"
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
